# DFlash draft for Qwen3-8B with Qwen3.5-MoE FFNs (moe_preset: qwen3_5_moe):
# top-10 of 512 experts (width 512) plus one sigmoid-gated shared expert
# (width 2048) in each of the five draft layers, ~16B parameters in total.
# Weights and optimizer state must be sharded across the trainer ranks.
model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config: configs/qwen3-8b-dflash-moe.json
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16

data:
  hidden_states_path: ./cache/hidden_states/qwen3-8b-dflash-sharegpt
  max_length: 3072
  chat_template: qwen
  cache_dir: ./cache

training:
  strategy: dflash
  num_epochs: 6
  max_steps: 10000
  batch_size: 1
  fsdp_sharding: FULL_SHARD
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  save_interval: 1000
  log_interval: 50
  dist_timeout: 30
  seed: 42

run_id: qwen3-8b-dflash-moe-offline
output_dir: ./outputs/qwen3-8b-dflash-moe-offline

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 8
