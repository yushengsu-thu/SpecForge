# Qwen3.8-27B DSpark MoE drafter (16 experts x 1088, top-1; configs/qwen3.8-27b-moe-dspark.json)
# on TWO 8x H200 nodes: eight TP=1 capture servers on the capture node, mooncake_master plus
# the producer and an eight-rank FSDP trainer on the trainer node.  The nodes share nothing
# but the network; features cross it through Mooncake (RDMA when the fabric allows it).
#
# Training protocol = the RadixArk/Qwen3.8-27B-DSpark v2 recipe as reproduced in
# qwen3.8-27b-dspark-regen-mixture-v1-6ep.yaml (kan/qwen38-dspark-ablation): the
# RadixArk/Qwen3.8-27B-Regen-Mixture-v1 corpus (1,269,290 conversations, qwen3.5 template,
# 8,192-token context), six epochs at global batch 512 (14,874 optimizer steps), a 250-step
# linear warm-up into constant 5e-4, grad clip 1.0, DSpark CE 0.1 / L1 0.9 / confidence 1.0,
# 512 anchors, decay gamma 4, flex attention, training block 16.  What differs from v2:
#   - the FFN is the MoE above (the dense 17408-wide FFN split 16 ways, one expert per token);
#   - the teacher is the BF16 target (Hopper cannot run the NVFP4 checkpoint v2 trained
#     against; Qwen/Qwen3.8-27B-FP8 also works and captures faster);
#   - the layout: 8 capture servers + DP8 instead of 4 + DP4, so batch_size 4 x
#     accumulation 16 x 8 ranks = 512.
#
# Capture node (CAPTURE_IP), one server per GPU, each process carrying the Mooncake
# variables (a nohup/tmux session inherits its own environment, not your shell's):
#   export MOONCAKE_MASTER_SERVER_ADDR=TRAINER_IP:35551 MOONCAKE_METADATA_SERVER=http://TRAINER_IP:35880/metadata
#   export MOONCAKE_LOCAL_HOSTNAME=CAPTURE_IP MOONCAKE_PROTOCOL=rdma   # or tcp
#   export MOONCAKE_GLOBAL_SEGMENT_SIZE=107374182400 MOONCAKE_LOCAL_BUFFER_SIZE=1073741824
#   for i in 0 1 2 3 4 5 6 7; do CUDA_VISIBLE_DEVICES=$i python -m sglang.launch_server \
#     --model-path Qwen/Qwen3.8-27B --dtype bfloat16 --trust-remote-code --skip-tokenizer-init \
#     --tp-size 1 --chunked-prefill-size -1 --enable-spec-capture --spec-capture-method dspark \
#     --spec-capture-aux-layer-ids 5 19 33 47 61 --host 0.0.0.0 --port $((30000+i)) --nccl-port $((37000+i)) \
#     --attention-backend triton --mem-fraction-static 0.85 --disable-radix-cache \
#     --context-length 8199 --max-running-requests 4 --max-total-tokens 32768 & sleep 30; done
# Trainer node (TRAINER_IP): mooncake_master --enable_http_metadata_server=true
#   --http_metadata_server_host=0.0.0.0 --rpc_port=35551 --http_metadata_server_port=35880
#   --default_kv_lease_ttl=300000, then, with CAPTURE_IP / TRAINER_IP replaced below,
#   python -m specforge.cli train -c <this file>
# Host-memory budget on the trainer node: a captured 8k sample is up to ~0.42 GiB of hidden
# states (~0.18 GiB at the corpus mean), so 768 in flight stays under the 640 GiB cap; both
# watermarks must cover the 512-sample optimizer quantum.
model:
  target_model_path: Qwen/Qwen3.8-27B
  draft_model_config: configs/qwen3.8-27b-moe-dspark.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  torch_dtype: bfloat16
  mask_token_id: 248070
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  # data.max_length + 7 tokens of request headroom for the capture endpoint.
  sglang_context_length: 8199
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 32768

data:
  # RadixArk/Qwen3.8-27B-Regen-Mixture-v1 as {id, conversations} JSONL (status == success rows).
  train_data_path: cache/dataset/qwen38_regen_mixture_v1_train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  cache_dir: cache/qwen3.8-27b-regen-mixture-v1
  build_dataset_num_proc: 64
  dataloader_num_workers: 8

training:
  strategy: dspark
  num_epochs: 6
  tp_size: 1
  # 8 ranks x 4 x 16 = 512 samples per optimizer step; 2,479 steps per epoch.
  batch_size: 4
  accumulation_steps: 16
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: false
  learning_rate: 0.0005
  lr_scheduler: constant
  # 250 warm-up steps of 14,874, as in the v2 recipe.
  warmup_ratio: 0.0168
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  # 2,479 = 37 x 67: every epoch end is checkpointed.
  save_interval: 2479
  max_checkpoints: 6
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 42

tracking:
  report_to: none

runtime:
  producer_lease: 8
  producer_concurrency: 32
  in_flight_high_watermark: 768
  in_flight_low_watermark: 512
  resident_high_watermark_bytes: 481036337152
  resident_low_watermark_bytes: 343597383680
  feature_store_max_resident_bytes: 687194767360

run_id: qwen3.8-27b-moe-dspark-8server-dp8-2node-h200
output_dir: outputs/qwen3.8-27b-moe-dspark-8server-dp8-2node-h200

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/qwen3.8-27b-moe-dspark-8server-dp8-2node-h200/control
    consumer_state_dir: outputs/qwen3.8-27b-moe-dspark-8server-dp8-2node-h200/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    server_urls:
      - http://CAPTURE_IP:30000
      - http://CAPTURE_IP:30001
      - http://CAPTURE_IP:30002
      - http://CAPTURE_IP:30003
      - http://CAPTURE_IP:30004
      - http://CAPTURE_IP:30005
      - http://CAPTURE_IP:30006
      - http://CAPTURE_IP:30007
    mooncake_metadata_server: http://TRAINER_IP:35880/metadata
    mooncake_master_server_addr: TRAINER_IP:35551
    mooncake_local_hostname: TRAINER_IP
    # rdma reads ~26 GB/s per client on h200-sci-k8s-1 against ~2.2 GB/s over the pod
    # network; tcp works everywhere but leaves the two-node layout fetch-bound.
    mooncake_protocol: rdma
