# dense-same: Qwen3-8B DSpark **dense** drafter (configs/qwen3-8b-dspark-causal-noconf-b16.json: block 16, causal draft
# block (is_causal: true, PR #942 / #960), vocabulary projection cached and flattened (PR #942 / #963, the published
# run's dspark_cache_projection / dspark_flatten_projection), DDP bucket 128 MB (PR #942 / #958), no
# confidence head, 5 layers, hidden 4096, FFN 12288) trained for 12 epochs with the hyperparameters of the
# published Qwen3-8B dense DSpark run (https://huggingface.co/jiapingW/Qwen3-8b-dspark-SpecForge): global batch
# 128, AdamW lr 6e-4 cosine with 4% warm-up, grad clip 1.0, 512 anchors, loss_decay_gamma 7.0, 0.1 CE + 0.9 L1.
#
# Layout: the 16x H200 devbox moe-16exp-1024dim as two nodes. CAPTURE_IP (rank 0) runs 8 TP1 bf16 spec-capture
# SGLang servers (scripts/launch/dense-same/capture_node.sh); TRAINER_IP (rank 1) runs mooncake_master, the
# producer and 8 DDP trainer ranks: batch_size 2 x accumulation_steps 8 x 8 ranks = global batch 128.
# scripts/launch/dense-same/trainer_node.sh renders CAPTURE_IP/TRAINER_IP, launches the trainer and the
# per-epoch export/upload watcher (scripts/launch/dense-same/watch_exports.sh -> yushengsu/dense-same/<ep>ep).
#
# Corpus: Open Perfect Blend regenerated by Qwen3-8B at temperature 0, thinking off
# (yaro1214/open_data/perfectblend_train_regen_temperature0_no_think.jsonl, 1,420,909 rows), chat template
# qwen3-instruct, max_length 8192 -> about 11,100 optimizer steps per epoch, about 133,200 for 12 epochs.
# save_interval is one epoch so every epoch end is a retained checkpoint. Results: exp_read.me.
model:
  target_model_path: /scratch/models/Qwen3-8B
  draft_model_config: configs/qwen3-8b-dspark-causal-noconf-b16.json
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  use_liger_kernel: true
  mask_token_id: 151669
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  sglang_context_length: 8208
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 65536
data:
  train_data_path: /scratch/dense/data/perfectblend_train_regen_temperature0_no_think.jsonl
  max_length: 8192
  chat_template: qwen3-instruct
  cache_dir: /scratch/dense/cache/qwen3-8b-dspark-perfectblend-nosys-8192
  build_dataset_num_proc: 64
  dataloader_num_workers: 8
training:
  strategy: dspark
  num_epochs: 12
  total_steps: null
  max_steps: null
  tp_size: 1
  batch_size: 2
  accumulation_steps: 8
  fsdp_sharding: NO_SHARD
  ddp_bucket_cap_mb: 128
  cache_vocab_projection: true
  flatten_vocab_projection: true
  optimizer_cpu_offload: false
  learning_rate: 0.0006
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 0.0
  save_interval: 11100
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 42
tracking:
  report_to: wandb
  wandb_project: qwen3-8b-dspark
  wandb_name: dense-same
  wandb_dir: /scratch/dense/outputs/dense-same/wandb
runtime:
  producer_lease: 8
  # PR #942 / #966: balance each 128-sample optimizer window across the 8 DDP ranks by estimated cost.
  consumer_dispatch: cost_balanced
  producer_concurrency: 32
  # four optimizer quanta (4 x 128 samples) in flight, refill below three
  in_flight_high_watermark: 512
  in_flight_low_watermark: 384
  resident_high_watermark_bytes: 343597383680
  resident_low_watermark_bytes: 257698037760
  feature_store_max_resident_bytes: 429496729600
run_id: dense-same
output_dir: /scratch/dense/outputs/dense-same
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: /scratch/dense/outputs/dense-same/control
    consumer_state_dir: /scratch/dense/outputs/dense-same/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    server_urls:
    - http://CAPTURE_IP:30000
    - http://CAPTURE_IP:30001
    - http://CAPTURE_IP:30002
    - http://CAPTURE_IP:30003
    - http://CAPTURE_IP:30004
    - http://CAPTURE_IP:30005
    - http://CAPTURE_IP:30006
    - http://CAPTURE_IP:30007
    mooncake_metadata_server: http://TRAINER_IP:35880/metadata
    mooncake_master_server_addr: TRAINER_IP:35551
    mooncake_local_hostname: TRAINER_IP
    mooncake_protocol: rdma
