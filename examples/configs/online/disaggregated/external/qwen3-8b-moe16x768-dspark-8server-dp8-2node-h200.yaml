# Qwen3-8B DSpark MoE drafter (16 experts x 768, top-1; configs/qwen3-8b-moe16x768-16A1-dspark.json) trained with the
# jiapingW/Qwen3-8b-dspark-SpecForge protocol on TWO 8x H200 nodes: eight TP=1 capture servers on the capture
# node, mooncake_master plus the producer and an eight-rank DDP trainer on the trainer node.
#
# Protocol = that repo's training/launch.yaml: PerfectBlend regenerated by Qwen3-8B at temperature 0 in
# non-thinking mode (yaro1214/open_data, perfectblend_train_regen_temperature0_no_think.jsonl), qwen3-instruct
# template, no system prompt, 8,192-token context; six epochs; AdamW lr 6e-4 cosine with a 4% warm-up, grad
# clip 1.0; DSpark CE 0.1 / L1 0.9, no confidence head, 512 anchors, decay gamma 7, flex attention, NO_SHARD
# DDP with 128 MB buckets; BF16 target; save every 3,000 steps.  The only differences:
#   - the draft's FFN is the MoE above (the dense 12288-wide FFN split 16 ways, one expert per token);
#   - the global batch of 128 comes from 8 ranks x 2 x 8 instead of 32 ranks x 2 x 2 (same samples per
#     optimizer step, so the planned 66,604 steps and the cosine schedule are unchanged);
#   - Liger kernels and projection flattening / caching are not wired for DSpark on this branch.
#
# Capture node (CAPTURE_IP), one server per GPU, each process carrying the Mooncake variables:
#   export MOONCAKE_MASTER_SERVER_ADDR=TRAINER_IP:35551 MOONCAKE_METADATA_SERVER=http://TRAINER_IP:35880/metadata
#   export MOONCAKE_LOCAL_HOSTNAME=CAPTURE_IP MOONCAKE_PROTOCOL=rdma MOONCAKE_RDMA_DEVICES=<active HCAs>
#   export MOONCAKE_GLOBAL_SEGMENT_SIZE=107374182400 MOONCAKE_LOCAL_BUFFER_SIZE=1073741824
#   for i in 0 1 2 3 4 5 6 7; do CUDA_VISIBLE_DEVICES=$i python -m sglang.launch_server \
#     --model-path Qwen/Qwen3-8B --dtype bfloat16 --trust-remote-code --skip-tokenizer-init --tp-size 1 \
#     --chunked-prefill-size -1 --enable-spec-capture --spec-capture-method dspark \
#     --spec-capture-aux-layer-ids 1 9 17 25 33 --host 0.0.0.0 --port $((30000+i)) --nccl-port $((37000+i)) \
#     --attention-backend triton --mem-fraction-static 0.85 --disable-radix-cache --context-length 8208 \
#     --max-running-requests 4 --max-total-tokens 65536 & sleep 30; done
# Trainer node (TRAINER_IP): mooncake_master --enable_http_metadata_server=true --http_metadata_server_host=0.0.0.0
#   --rpc_port=35551 --http_metadata_server_port=35880 --default_kv_lease_ttl=300000, then, with CAPTURE_IP /
#   TRAINER_IP replaced below, python -m specforge.cli train -c <this file>
model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config: configs/qwen3-8b-moe16x768-16A1-dspark.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  mask_token_id: 151669
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  # data.max_length + 16 tokens of request headroom for the capture endpoint.
  sglang_context_length: 8208
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 65536

data:
  train_data_path: cache/dataset/perfectblend_train_regen_temperature0_no_think.jsonl
  max_length: 8192
  chat_template: qwen3-instruct
  cache_dir: cache/qwen3-8b-dspark-perfectblend-8192
  build_dataset_num_proc: 32
  dataloader_num_workers: 8

training:
  strategy: dspark
  num_epochs: 6
  tp_size: 1
  # 8 ranks x 2 x 8 = 128 samples per optimizer step (jiapingW: 32 ranks x 2 x 2).
  batch_size: 2
  accumulation_steps: 8
  fsdp_sharding: NO_SHARD
  ddp_bucket_cap_mb: 128
  learning_rate: 0.0006
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 0.0
  save_interval: 3000
  max_checkpoints: 1
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 42

tracking:
  report_to: none

runtime:
  producer_lease: 8
  producer_concurrency: 8
  # Both watermarks must cover the 128-sample optimizer quantum.
  in_flight_high_watermark: 528
  in_flight_low_watermark: 396

run_id: qwen3-8b-moe16x768-dspark-8server-dp8-2node-h200
output_dir: outputs/qwen3-8b-moe16x768-dspark-8server-dp8-2node-h200

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/qwen3-8b-moe16x768-dspark-8server-dp8-2node-h200/control
    consumer_state_dir: outputs/qwen3-8b-moe16x768-dspark-8server-dp8-2node-h200/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    server_urls:
      - http://CAPTURE_IP:30000
      - http://CAPTURE_IP:30001
      - http://CAPTURE_IP:30002
      - http://CAPTURE_IP:30003
      - http://CAPTURE_IP:30004
      - http://CAPTURE_IP:30005
      - http://CAPTURE_IP:30006
      - http://CAPTURE_IP:30007
    mooncake_metadata_server: http://TRAINER_IP:35880/metadata
    mooncake_master_server_addr: TRAINER_IP:35551
    mooncake_local_hostname: TRAINER_IP
    mooncake_protocol: rdma
