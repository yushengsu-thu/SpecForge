# Qwen3-8B DSpark dense drafter with a 24576-wide FFN (configs/qwen3-8b-dense-24576-dspark.json): the 5-layer 8E2A
# MoE recipe (configs/qwen3-8b-moe8x12288-8A2-dspark.json, 8 experts x 12288, top-2) with the MoE replaced by ONE
# dense SwiGLU FFN whose intermediate size equals the two active experts (2 x 12288 = 24576), i.e. the same active
# FFN FLOPs per token as 8E2A with 1/4 of its FFN parameters (0.30 B instead of 1.21 B per layer; ~1.8 B total).
# Trained with the jiapingW/Qwen3-8b-dspark-SpecForge protocol on THREE 8x H200 nodes in the external-services layout:
# eight TP=1 patched-SGLang capture servers on all GPUs of the capture node (started by hand with the managed-local
# server command line plus --disable-cuda-graph, --host 0.0.0.0, MOONCAKE_LOCAL_HOSTNAME = that node's address) publishing over Mooncake tcp
# (~50 MB of features per sample, ~12 Gbps into each trainer node at 63 samples/s) to the Mooncake master on trainer
# node 0, and a SIXTEEN-rank DDP trainer over all 8 GPUs of two trainer nodes (`--role consumer --node-rank 0|1`, static
# torchrun rendezvous on trainer-node-0:28711 over InfiniBand; the producer runs on trainer node 0 and remote ranks pull
# the reference stream from rank 0's inbox server). Node-local env on every trainer/capture node: MOONCAKE_LOCAL_HOSTNAME,
# NCCL_SOCKET_IFNAME/GLOO_SOCKET_IFNAME = the routable interface, USE_LIBUV=0 (the libuv rendezvous store was not
# reachable across these pods), and the other nodes' hostnames in /etc/hosts.
#
# Protocol = that repo's training/launch.yaml: PerfectBlend regenerated by Qwen3-8B at temperature 0 in
# non-thinking mode (yaro1214/open_data, perfectblend_train_regen_temperature0_no_think.jsonl), qwen3-instruct
# template, no system prompt, 8,192-token context; AdamW lr 6e-4 cosine with a 4% warm-up, grad clip 1.0;
# DSpark CE 0.1 / L1 0.9, no confidence head, 512 anchors, decay gamma 7, flex attention; BF16 target.
# Training values are the 8E2A recipe's except model.use_liger_kernel (a speed-only kernel choice) and the optimizer quantum: 16 ranks x 2 x 4 = 128 samples per step
# (jiapingW's global batch; 8E2A used 6 x 2 x 11 = 132), so an epoch is 1,420,909 // 128 = 11,100 steps and
# save_interval 2775 lands a checkpoint at every epoch end; 5 epochs = 55,500 steps. Comparators: the 8E2A MoE
# draft (yushengsu/Qwen3-8B-5layer-MoE-8E2A-v1) and the 5-layer dense FFN-12288 draft (jiapingW/Qwen3-8b-dspark-SpecForge).
# Replace capture-node / trainer-node below with the nodes' routable addresses (kept out of checked-in YAML).
model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config: configs/qwen3-8b-dense-24576-dspark.json
  # Liger fused RMSNorm + SwiGLU for the draft (sgl-project/SpecForge#963, cherry-picked on this branch; speed-only kernel choice).
  use_liger_kernel: true
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  mask_token_id: 151669
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  # data.max_length + 16 tokens of request headroom for the capture endpoint.
  sglang_context_length: 8208
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 65536

data:
  train_data_path: cache/dataset/perfectblend_train_regen_temperature0_no_think.jsonl
  max_length: 8192
  chat_template: qwen3-instruct
  cache_dir: cache/qwen3-8b-dspark-perfectblend-8192
  build_dataset_num_proc: 32
  dataloader_num_workers: 8

training:
  strategy: dspark
  num_epochs: 5
  # 5 prompt epochs x 1,420,903 prompts at 16 x 2 x 4 = 128 per step (resolve_online_total_steps). Set explicitly for
  # multi-node consumers: a remote trainer node cannot see the producer-owned schedule file in node 0's control_dir and
  # would wait for it forever while node 0 waits in the first collective.
  total_steps: 55504
  tp_size: 1
  # 16 ranks x 2 x 4 = 128 samples per optimizer step (jiapingW: 32 ranks x 2 x 2 = 128).
  batch_size: 2
  accumulation_steps: 4
  fsdp_sharding: SHARD_GRAD_OP
  ddp_bucket_cap_mb: 128
  learning_rate: 0.0006
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  # Skip the update on a gradient-norm outlier: the 8 x 1536 run took one at step 8,580 (145 x the recent
  # median) that cost ~900 steps of recovery; a 10 x rule would have skipped only that step and one other.
  spike_guard_ratio: 10
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 0.0
  # A checkpoint every 1,000 steps, each exported and uploaded; the trainer only saves on interval hits, so the
  # last one of the 64,584-step run is step 64,000 (the cosine lr is ~0 by then).
  # one checkpoint per quarter epoch; 11,100 / 4 = 2775 lands one at every epoch end
  save_interval: 2775
  # Epoch ends (10,764 steps each) are not on the 1,000-step grid: checkpoint them too (ep1 … ep5; ep6 is the last step).
  save_steps: [10764, 21528, 32292, 43056, 53820]
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 42

tracking:
  report_to: none

runtime:
  producer_lease: 8
  producer_concurrency: 8
  # Both watermarks must cover the 132-sample optimizer quantum.
  in_flight_high_watermark: 528
  in_flight_low_watermark: 396
  resident_high_watermark_bytes: 214748364800
  resident_low_watermark_bytes: 128849018880
  feature_store_max_resident_bytes: 274877906944

run_id: qwen3-8b-dense-24576-dspark-8server-dp16-3node-h200
output_dir: outputs/qwen3-8b-dense-24576-dspark-8server-dp16-3node-h200

deployment:
  mode: disaggregated
  trainer:
    nnodes: 2
    nproc_per_node: 8
    master_addr: trainer-node-0
    master_port: 28711
  disaggregated:
    control_dir: outputs/qwen3-8b-dense-24576-dspark-8server-dp16-3node-h200/control
    consumer_state_dir: outputs/qwen3-8b-dense-24576-dspark-8server-dp16-3node-h200/consumer-state
    # rank 0 serves the tensor-free reference stream to the remote trainer node (binds all interfaces)
    inbox_server_url: http://trainer-node-0:35900
    backend: mooncake
    client_buffer_size: 1073741824
    # the eight capture servers on the capture node (one H200 each, ports 30000-30007). They run with --disable-cuda-graph:
    # a capture server that hit a 1-token decode batch through the CUDA-graph path crashed (patched SGLang's hidden-state
    # capture-mode assertion), its published features became unreadable and the whole run failed at step 7,920.
    server_urls:
      - http://capture-node:30000
      - http://capture-node:30001
      - http://capture-node:30002
      - http://capture-node:30003
      - http://capture-node:30004
      - http://capture-node:30005
      - http://capture-node:30006
      - http://capture-node:30007
    # mooncake_master on the trainer node: --enable_http_metadata_server=true --http_metadata_server_host=0.0.0.0
    # --rpc_port=35551 --http_metadata_server_port=35880 --default_kv_lease_ttl=300000
    mooncake_metadata_server: http://trainer-node-0:35880/metadata
    mooncake_master_server_addr: trainer-node-0:35551
    mooncake_protocol: tcp
