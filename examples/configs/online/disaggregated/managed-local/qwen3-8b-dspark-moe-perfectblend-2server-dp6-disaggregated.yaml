# Qwen3-8B DSpark **MoE** drafter (configs/qwen3-8b-dspark-moe.json): Kan's Qwen3.8-27B
# MoE structure at the Qwen3-8B width — 8 routed SwiGLU experts of width 4096, top-1
# softmax routing WITHOUT top-k renormalisation (a renormalised top-1 weight is always 1
# and the router would get no task gradient), one sigmoid-gated shared expert of width
# 2048, sample router centering, auxiliary balance loss 0.001, grouped_mm dispatch.
# ~2.4B parameters total, ~0.7B active per token (dense drafter: ~1.05B, FFN 12288).
#
# Corpus: Open Perfect Blend regenerated by Qwen3-8B at temperature 0 with thinking off
# (https://huggingface.co/datasets/yaro1214/open_data, 1,420,909 rows), rendered with the
# qwen3-instruct template (the empty <think></think> block carries no loss) and no system
# prompt beyond the template default. 8 GPUs, single node, managed_local: 2 TP1 bf16
# capture servers (GPUs 0-1) + 6 FSDP trainer ranks (GPUs 2-7), batch_size 4 x
# accumulation 8 x 6 ranks = global batch 192 -> 7,401 steps per epoch.
#
# Prepare: hf download yaro1214/open_data perfectblend_train_regen_temperature0_no_think.jsonl \
#            --repo-type dataset --local-dir ./cache/dataset
# Smoke (3 optimizer steps on a 2,000-row slice; DSpark's loss-mask filter applies
# data.max_prompts only after tokenizing the whole file, so slice the file instead):
#   head -n 2000 ./cache/dataset/perfectblend_train_regen_temperature0_no_think.jsonl > ./cache/dataset/perfectblend_smoke_2000.jsonl
#   specforge train -c examples/configs/online/disaggregated/managed-local/qwen3-8b-dspark-moe-perfectblend-2server-dp6-disaggregated.yaml \
#     data.train_data_path=./cache/dataset/perfectblend_smoke_2000.jsonl data.cache_dir=./cache/qwen3-8b-smoke-moe \
#     training.max_steps=3 training.save_interval=3 training.log_interval=1 tracking.report_to=none \
#     run_id=qwen3-8b-dspark-moe-smoke output_dir=outputs/qwen3-8b-dspark-moe-smoke deployment.disaggregated.control_dir=outputs/qwen3-8b-dspark-moe-smoke/control
# Full run: drop the overrides (one epoch; raise training.num_epochs for more).
model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config: configs/qwen3-8b-dspark-moe.json
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  mask_token_id: 151669
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  sglang_context_length: 8199
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 65536
data:
  train_data_path: ./cache/dataset/perfectblend_train_regen_temperature0_no_think.jsonl
  max_length: 8192
  chat_template: qwen3-instruct
  cache_dir: ./cache/qwen3-8b-perfectblend-nothink-8192
  build_dataset_num_proc: 64
  dataloader_num_workers: 8
training:
  strategy: dspark
  num_epochs: 1
  batch_size: 4
  accumulation_steps: 8
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: false
  learning_rate: 0.0006
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 500
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 15
  seed: 42
  prompt_seed: 42
tracking:
  report_to: tensorboard
runtime:
  producer_lease: 8
  producer_concurrency: 8
  # 1.5 optimizer quanta (192 samples) in flight; Qwen3-8B features are ~5 x 4096 x
  # tokens x 2 bytes per sample, so 200 GiB resident is ~2,000 full-length samples.
  in_flight_high_watermark: 288
  in_flight_low_watermark: 192
  resident_high_watermark_bytes: 214748364800
  resident_low_watermark_bytes: 128849018880
  feature_store_max_resident_bytes: 274877906944
run_id: qwen3-8b-dspark-moe-perfectblend-2server-dp6
output_dir: outputs/qwen3-8b-dspark-moe-perfectblend-2server-dp6
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 6
  disaggregated:
    control_dir: outputs/qwen3-8b-dspark-moe-perfectblend-2server-dp6/control
    backend: mooncake
    client_buffer_size: 1073741824
    managed_local:
      trainer_cuda_visible_devices:
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
        - "7"
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 107374182400
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 300000
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
        - port: 30001
          cuda_visible_devices:
            - "1"
          tp_size: 1
