# 2-LAYER ablation of Kan's qwen3.8-27b-dspark-moe-regen-mixture-v1-1ep-v3 recipe on one 8x H200 node
# (devbox specforge-qwen-h200). Only change vs Kan's run besides hardware: draft num_hidden_layers 5 -> 2
# (same 512x512 top-10 MoE FFN + sigmoid-gated shared expert, same target_layer_ids 5/19/33/47/61).
# Target served in bf16 (Qwen/Qwen3.8-27B; the NVFP4 build needs Blackwell).
# batch_size 4 x accumulation 16 x 4 ranks = global batch 256, exactly as Kan's -1ep-v3 run.
# Local /scratch paths, no W&B. Everything else unchanged.
# Paths are repository-relative here; the actual run used /scratch/models/Qwen3.8-27B, /scratch/data, /scratch/cache
# and /scratch/outputs on devbox specforge-qwen-h200 (see docs/runbooks/qwen38-27b-dspark-moe-2layer-h200.md).
model:
  target_model_path: Qwen/Qwen3.8-27B
  draft_model_config: configs/qwen3.8-27b-dspark-moe-v2-2layer.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  load_target_embedding: true
  torch_dtype: bfloat16
  mask_token_id: 248070
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  sglang_context_length: 8199
  sglang_max_running_requests: 2
  sglang_max_total_tokens: 32768
data:
  train_data_path: cache/dataset/qwen38_regen_mixture_v1_train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  cache_dir: cache/qwen3.8-27b-regen-mixture-v1
  build_dataset_num_proc: 64
  dataloader_num_workers: 8
training:
  strategy: dspark
  num_epochs: 1
  batch_size: 4
  accumulation_steps: 16
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: true
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 500
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 15
  seed: 42
  prompt_seed: 42
tracking:
  report_to: none
runtime:
  producer_lease: 8
  producer_concurrency: 8
  in_flight_high_watermark: 768
  in_flight_low_watermark: 512
  resident_high_watermark_bytes: 322122547200
  resident_low_watermark_bytes: 214748364800
  feature_store_max_resident_bytes: 408021893120
run_id: qwen3.8-27b-dspark-moe-2layer-regen-mixture-v1-1ep-h200
output_dir: outputs/qwen3.8-27b-dspark-moe-2layer-regen-mixture-v1-1ep-h200
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/qwen3.8-27b-dspark-moe-2layer-regen-mixture-v1-1ep-h200/control
    consumer_state_dir: outputs/qwen3.8-27b-dspark-moe-2layer-regen-mixture-v1-1ep-h200/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    managed_local:
      trainer_cuda_visible_devices:
      - '4'
      - '5'
      - '6'
      - '7'
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 107374182400
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 300000
      capture_servers:
      - port: 30000
        cuda_visible_devices:
        - '0'
        tp_size: 1
      - port: 30001
        cuda_visible_devices:
        - '1'
        tp_size: 1
      - port: 30002
        cuda_visible_devices:
        - '2'
        tp_size: 1
      - port: 30003
        cuda_visible_devices:
        - '3'
        tp_size: 1
