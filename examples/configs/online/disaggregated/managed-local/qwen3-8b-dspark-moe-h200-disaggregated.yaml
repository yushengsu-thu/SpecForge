# Qwen3-8B teacher + five-layer DSpark MoE, one 8xH200 node.
# Capture GPUs0-3; FULL_SHARD trainers GPUs4-7. No existing services may own them.
# Launch with the allocator inherited by every managed child:
# PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True specforge train --config <this-file>
# This runtime recipe is distinct from the small offline FFN smoke example.
model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config: configs/qwen3-8b-dspark-moe.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  mask_token_id: 151669
  # Native MoE FFNs; avoid an unrelated Liger installation prerequisite.
  use_liger_kernel: false
  sglang_attention_backend: flashinfer
  sglang_disable_radix_cache: true
  # data.max_length plus the capture endpoint's seven-token headroom.
  sglang_context_length: 8199

data:
  # ShareGPT-style conversations; use assistant turns generated by this teacher.
  train_data_path: ./cache/dataset/qwen3-8b-regen-train.jsonl
  max_length: 8192
  chat_template: qwen
  build_dataset_num_proc: 32
  dataloader_num_workers: 8
  cache_dir: cache/qwen3-8b-dspark-moe

training:
  strategy: dspark
  num_epochs: 1
  tp_size: 1
  batch_size: 2
  accumulation_steps: 64
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: true
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 125
  log_interval: 1
  dist_timeout: 30
  seed: 42
  prompt_seed: 42

tracking:
  report_to: none

runtime:
  producer_lease: 4
  producer_concurrency: 4
  # An optimizer window consumes4ranks x2samples x64microsteps =512refs.
  # Leave room for prefetched/capturing refs before durable optimizer-step ACK.
  in_flight_high_watermark: 768
  in_flight_low_watermark: 512

run_id: qwen3-8b-dspark-moe-h200-disaggregated
output_dir: outputs/qwen3-8b-dspark-moe-h200-disaggregated

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/qwen3-8b-dspark-moe-h200-disaggregated/control
    consumer_state_dir: outputs/qwen3-8b-dspark-moe-h200-disaggregated/consumer-state
    backend: mooncake
    receive_buffers: pinned
    client_buffer_size: 2147483648
    managed_local:
      trainer_cuda_visible_devices: ["4", "5", "6", "7"]
      mooncake:
        protocol: tcp
        rpc_port: 36551
        metadata_port: 36880
        metrics_port: 36903
        default_kv_lease_ttl_ms: 10000
        # Per capture server. Max-size payload is6 x8192 x4096 xBF16 =384MiB.
        # Four128GiB contributions cover768 x384MiB (288GiB) with headroom.
        global_segment_size_bytes: 137438953472
        local_buffer_size_bytes: 4294967296
      capture_servers:
        - port: 33000
          cuda_visible_devices: ["0"]
          tp_size: 1
          mem_fraction_static: 0.7
        - port: 33001
          cuda_visible_devices: ["1"]
          tp_size: 1
          mem_fraction_static: 0.7
        - port: 33002
          cuda_visible_devices: ["2"]
          tp_size: 1
          mem_fraction_static: 0.7
        - port: 33003
          cuda_visible_devices: ["3"]
          tp_size: 1
          mem_fraction_static: 0.7
