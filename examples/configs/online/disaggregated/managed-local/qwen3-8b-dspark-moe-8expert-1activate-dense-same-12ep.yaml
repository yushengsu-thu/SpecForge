# Qwen3-8B DSpark MoE drafter - 8 routed experts, top-1 routing (one active expert per token),
# NO shared expert - trained with the hyperparameters of the Qwen3-8B dense DSpark run
# (https://huggingface.co/jiapingW/Qwen3-8b-dspark-SpecForge, training/launch.yaml) for 12 epochs
# in ONE run (one cosine schedule over all 12 epochs, one W&B run).
# Experiment branch: exp/qwen3-8b-dspark-moe-8expert-1activate-dense-same. Setup, status and
# per-epoch results: exp_read.me at the repository root (regenerated by
# experiments/qwen3-8b-dspark-moe-8expert-1activate/epoch_report.py).
#
# Draft config: configs/qwen3-8b-dspark-moe-8x1536-top1-noconf-b16.json = the branch's MoE config
# (configs/qwen3-8b-dspark-moe-noconf-b16.json) with moe_intermediate_size 1536 and no shared
# expert. It is the MoE arm of a three-way comparison with the same residual hidden (4096),
# attention (32/8 heads, head_dim 128) and depth (5 layers):
#   full dense  (branch dense-same): MLP 12288                      -> active 12288, total 12288
#   dense-1/8   (branch dense-1/8):  MLP 1536                       -> active 1536,  total 1536
#   this MoE:                        8 experts x 1536, top-1, no shared -> active 1536, total 12288
# i.e. each expert is the dense-1/8 MLP and the eight together are the full dense MLP. Routing:
# top-1 softmax without top-k renormalisation, sample router centering, auxiliary balance loss
# 0.001, grouped_mm dispatch (unchanged from the branch MoE config).
#
# Dense-run hyperparameters kept verbatim: AdamW 6e-4, cosine, 4% warmup, max_grad_norm 1.0,
# num_anchors 512, loss_decay_gamma 7.0, objective_chunk_blocks 128, 0.1 CE + 0.9 L1, no
# confidence head, NO_SHARD DDP, bf16 + Liger kernels, flex_attention, max_length 8192,
# qwen3-instruct template, seed 42.
# Deviations: global batch 132 (batch_size 2 x accumulation 11 x 6 trainer ranks; the dense run
# used 128 on 32 ranks and the dense-1/8 arm 133), 12 epochs, checkpoints every 2691 optimizer
# steps so that every 4th checkpoint lands on an epoch boundary (1,420,903 prompts after
# filtering / 132 = 10,764.42 steps per epoch, 129,173 steps in total; step k x 10,764 is within
# 5 steps before the end of epoch k). The epoch checkpoints are copied out of the rotation,
# exported and uploaded by the watcher next to this recipe.
#
# Corpus and GPU layout as in qwen3-8b-dspark-moe-noconf-b16-perfectblend-2server-dp6-disaggregated.yaml:
# Open Perfect Blend regenerated by Qwen3-8B at temperature 0 with thinking off
# (https://huggingface.co/datasets/yaro1214/open_data, 1,420,909 rows); 8 GPUs, single node,
# managed_local: 2 TP1 bf16 capture servers (GPUs 0-1) + 6 DDP trainer ranks (GPUs 2-7). A single
# capture server was tried: it ran stop-and-go against the producer window and did not beat the
# two-server layout, so the branch layout is kept.
#
# Launch (box paths are passed as overrides, see experiments/qwen3-8b-dspark-moe-8expert-1activate/launch.sh):
#   specforge train -c examples/configs/online/disaggregated/managed-local/qwen3-8b-dspark-moe-8expert-1activate-dense-same-12ep.yaml
model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config: configs/qwen3-8b-dspark-moe-8x1536-top1-noconf-b16.json
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  use_liger_kernel: true
  mask_token_id: 151669
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  sglang_context_length: 8208
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 65536
data:
  train_data_path: ./cache/dataset/perfectblend_train_regen_temperature0_no_think.jsonl
  max_length: 8192
  chat_template: qwen3-instruct
  cache_dir: ./cache/qwen3-8b-dspark-perfectblend-8192
  build_dataset_num_proc: 64
  dataloader_num_workers: 8
training:
  strategy: dspark
  num_epochs: 12
  total_steps: null
  max_steps: null
  tp_size: 1
  batch_size: 2
  accumulation_steps: 11
  fsdp_sharding: NO_SHARD
  optimizer_cpu_offload: false
  learning_rate: 0.0006
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 0.0
  save_interval: 2691
  max_checkpoints: 8
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 42
tracking:
  report_to: wandb
  wandb_project: specforge-qwen3-8b-dspark
  wandb_name: qwen3-8b-dspark-moe-8expert-1activate-dense-same
runtime:
  producer_lease: 8
  producer_concurrency: 8
  # Four optimizer quanta (132 samples) in flight, refill as soon as one quantum drains, so the
  # producer never idles against the watermark (with a two-quantum window a capture server ran
  # stop-and-go and every other optimizer step waited for the producer). Qwen3-8B features are
  # ~5 x 4096 x tokens x 2 bytes per sample, so 200 GiB resident is ~2,000 full-length samples.
  in_flight_high_watermark: 528
  in_flight_low_watermark: 396
  resident_high_watermark_bytes: 214748364800
  resident_low_watermark_bytes: 128849018880
  feature_store_max_resident_bytes: 274877906944
run_id: qwen3-8b-dspark-moe-8expert-1activate-dense-same
output_dir: outputs/qwen3-8b-dspark-moe-8expert-1activate-dense-same
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 6
  disaggregated:
    control_dir: outputs/qwen3-8b-dspark-moe-8expert-1activate-dense-same/control
    backend: mooncake
    client_buffer_size: 1073741824
    managed_local:
      trainer_cuda_visible_devices:
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
        - "7"
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 107374182400
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 300000
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
        - port: 30001
          cuda_visible_devices:
            - "1"
          tp_size: 1
