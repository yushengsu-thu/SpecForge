# Qwen3-8B DSpark MoE drafter (16 experts x 768, top-1; configs/qwen3-8b-moe16x768-16A1-dspark.json) trained with
# the jiapingW/Qwen3-8b-dspark-SpecForge protocol on ONE 8x H200 node: two TP=1 capture servers on GPUs 0-1 and a
# six-rank DDP trainer on GPUs 2-7, all owned by `specforge train`.  Capture is cheap for an 8B target (one H200
# server captures ~16 samples/s), so the trainer gets most of the GPUs.
#
# Protocol = that repo's training/launch.yaml: PerfectBlend regenerated by Qwen3-8B at temperature 0 in
# non-thinking mode (yaro1214/open_data, perfectblend_train_regen_temperature0_no_think.jsonl), qwen3-instruct
# template, no system prompt, 8,192-token context; six epochs; AdamW lr 6e-4 cosine with a 4% warm-up, grad
# clip 1.0; DSpark CE 0.1 / L1 0.9, no confidence head, 512 anchors, decay gamma 7, flex attention, NO_SHARD
# DDP with 128 MB buckets; BF16 target.  The differences:
#   - the draft's FFN is the MoE above (the dense 12288-wide FFN split 16 ways, one expert per token);
#   - the optimizer step is 6 ranks x 2 x 11 = 132 samples (jiapingW: 32 x 2 x 2 = 128), 10,764 steps per epoch;
#   - a checkpoint every 1,196 steps (= 1/9 epoch, so every epoch end too; three kept) instead of every 3,000;
#   - router balancing doubled / 10x: aux loss 0.01, selection-bias step 0.01 (0.005 / 0.001 collapsed at peak lr);
#   - Liger kernels and projection flattening / caching are not wired for DSpark on this branch.
model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config: configs/qwen3-8b-moe16x768-16A1-dspark.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  mask_token_id: 151669
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  # data.max_length + 16 tokens of request headroom for the capture endpoint.
  sglang_context_length: 8208
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 65536

data:
  train_data_path: cache/dataset/perfectblend_train_regen_temperature0_no_think.jsonl
  max_length: 8192
  chat_template: qwen3-instruct
  cache_dir: cache/qwen3-8b-dspark-perfectblend-8192
  build_dataset_num_proc: 32
  dataloader_num_workers: 8

training:
  strategy: dspark
  num_epochs: 6
  tp_size: 1
  # 6 ranks x 2 x 11 = 132 samples per optimizer step (jiapingW: 32 ranks x 2 x 2 = 128).
  batch_size: 2
  accumulation_steps: 11
  fsdp_sharding: NO_SHARD
  ddp_bucket_cap_mb: 128
  learning_rate: 0.0006
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 0.0
  # 10,764 steps per epoch = 9 x 1196: a checkpoint every 1,196 steps lands on every epoch end too, and
  # a router collapse (the first run lost its router 120 steps after the warm-up) can be rolled back.
  save_interval: 1196
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 42

tracking:
  report_to: none

runtime:
  producer_lease: 8
  producer_concurrency: 8
  # Both watermarks must cover the 132-sample optimizer quantum.
  in_flight_high_watermark: 528
  in_flight_low_watermark: 396
  resident_high_watermark_bytes: 214748364800
  resident_low_watermark_bytes: 128849018880
  feature_store_max_resident_bytes: 274877906944

run_id: qwen3-8b-moe16x768-16A1-dspark-2server-dp6-h200
output_dir: outputs/qwen3-8b-moe16x768-16A1-dspark-2server-dp6-h200

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 6
  disaggregated:
    control_dir: outputs/qwen3-8b-moe16x768-16A1-dspark-2server-dp6-h200/control
    consumer_state_dir: outputs/qwen3-8b-moe16x768-16A1-dspark-2server-dp6-h200/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    managed_local:
      trainer_cuda_visible_devices: ["2", "3", "4", "5", "6", "7"]
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 107374182400
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 300000
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["0"]
          tp_size: 1
        - port: 30001
          cuda_visible_devices: ["1"]
          tp_size: 1
