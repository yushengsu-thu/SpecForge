# Qwen3.8-27B DSpark MoE drafter: ONE MORE epoch (4,958 steps at global batch 256) on top of Kan's
# 3-epoch checkpoint, on one 8x H200 node, managed_local: 4 TP1 capture servers (GPUs 0-3) + 4-rank
# FSDP trainer (GPUs 4-7). Weights-only warm start (model.draft_checkpoint_path) from the HF export
# RadixArk/qwen38-dspark-moe-3ep-cont-step9916 converted with
#   python scripts/convert_dspark_moe_export_to_trainable.py --src <export dir> --dst /scratch/drafts/qwen38-moe-3ep-trainable
# (drops the folded router-centering gate.bias, adds zero EMA buffers; the trainer's strict warm start
# rejects the export as is - see the script's docstring). Fresh AdamW + 4% warm-up; prompt_seed 45 so the
# shuffle differs from epochs 1-3 (42/43/44), as in Kan's own phase B/C continuations.
# Differences from his qwen3.8-27b-dspark-moe-regen-mixture-v1-1ep-v3 recipe (8x B200): target served in
# bf16 (Qwen/Qwen3.8-27B; the NVFP4 build needs Blackwell), batch_size 2 x accumulation 32 instead of
# 4 x 16 (same global batch 256, less activation memory on 141 GB GPUs), local /scratch paths, no W&B.
# Everything else is unchanged. Measured on 2026-10-07/08: 31.5 s/step (capture ~8.5 samples/s, trainer
# 8.1 samples/s, so the two sides are balanced on this node); train/acc 0.628 at step 10 against
# 0.617-0.638 at the end of his 3-epoch run.
model:
  target_model_path: /scratch/models/Qwen3.8-27B
  draft_model_config: /scratch/SpecForge-qwen38/configs/qwen3.8-27b-dspark-moe-v2.json
  draft_checkpoint_path: /scratch/drafts/qwen38-moe-3ep-trainable
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  load_target_embedding: true
  torch_dtype: bfloat16
  mask_token_id: 248070
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  sglang_context_length: 8199
  sglang_max_running_requests: 2
  sglang_max_total_tokens: 32768
data:
  train_data_path: /scratch/data/qwen38_regen_mixture_v1_train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  cache_dir: /scratch/cache/qwen3.8-27b-regen-mixture-v1
  build_dataset_num_proc: 64
  dataloader_num_workers: 8
training:
  strategy: dspark
  num_epochs: 1
  batch_size: 2
  accumulation_steps: 32
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: true
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 500
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 15
  seed: 42
  prompt_seed: 45
tracking:
  report_to: none
runtime:
  producer_lease: 8
  producer_concurrency: 8
  in_flight_high_watermark: 768
  in_flight_low_watermark: 512
  resident_high_watermark_bytes: 322122547200
  resident_low_watermark_bytes: 214748364800
  feature_store_max_resident_bytes: 408021893120
run_id: qwen3.8-27b-dspark-moe-regen-mixture-v1-cont1ep-from-3ep-h200
output_dir: /scratch/outputs/qwen3.8-27b-dspark-moe-regen-mixture-v1-cont1ep-from-3ep-h200
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: /scratch/outputs/qwen3.8-27b-dspark-moe-regen-mixture-v1-cont1ep-from-3ep-h200/control
    consumer_state_dir: /scratch/outputs/qwen3.8-27b-dspark-moe-regen-mixture-v1-cont1ep-from-3ep-h200/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    managed_local:
      trainer_cuda_visible_devices:
      - '4'
      - '5'
      - '6'
      - '7'
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 107374182400
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 300000
      capture_servers:
      - port: 30000
        cuda_visible_devices:
        - '0'
        tp_size: 1
      - port: 30001
        cuda_visible_devices:
        - '1'
        tp_size: 1
      - port: 30002
        cuda_visible_devices:
        - '2'
        tp_size: 1
      - port: 30003
        cuda_visible_devices:
        - '3'
        tp_size: 1
