# Qwen3-8B DSpark dense drafter with a 24576-wide FFN (configs/qwen3-8b-dense-24576-dspark.json): the 5-layer 8E2A
# MoE recipe (configs/qwen3-8b-moe8x12288-8A2-dspark.json, 8 experts x 12288, top-2) with the MoE replaced by ONE
# dense SwiGLU FFN whose intermediate size equals the two active experts (2 x 12288 = 24576), i.e. the same active
# FFN FLOPs per token as 8E2A with 1/4 of its FFN parameters (0.30 B instead of 1.21 B per layer; ~1.8 B total).
# Trained with the jiapingW/Qwen3-8b-dspark-SpecForge protocol on ONE 8x H200 node: two TP=1 capture servers on
# GPUs 0-1 and a six-rank DDP trainer on GPUs 2-7, all owned by `specforge train`.
#
# Protocol = that repo's training/launch.yaml: PerfectBlend regenerated by Qwen3-8B at temperature 0 in
# non-thinking mode (yaro1214/open_data, perfectblend_train_regen_temperature0_no_think.jsonl), qwen3-instruct
# template, no system prompt, 8,192-token context; AdamW lr 6e-4 cosine with a 4% warm-up, grad clip 1.0;
# DSpark CE 0.1 / L1 0.9, no confidence head, 512 anchors, decay gamma 7, flex attention; BF16 target.
# Everything below is identical to the 8E2A recipe (5 epochs, 6 ranks x 2 x 11 = 132 samples per optimizer
# step, 10,764 steps per epoch, SHARD_GRAD_OP) so that the dense FFN-24576 draft is directly comparable with
# the 8E2A MoE draft (yushengsu/Qwen3-8B-5layer-MoE-8E2A-v1) and the 5-layer dense FFN-12288 draft
# (jiapingW/Qwen3-8b-dspark-SpecForge).
model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config: configs/qwen3-8b-dense-24576-dspark.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  mask_token_id: 151669
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  # data.max_length + 16 tokens of request headroom for the capture endpoint.
  sglang_context_length: 8208
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 65536

data:
  train_data_path: cache/dataset/perfectblend_train_regen_temperature0_no_think.jsonl
  max_length: 8192
  chat_template: qwen3-instruct
  cache_dir: cache/qwen3-8b-dspark-perfectblend-8192
  build_dataset_num_proc: 32
  dataloader_num_workers: 8

training:
  strategy: dspark
  num_epochs: 5
  tp_size: 1
  # 6 ranks x 2 x 11 = 132 samples per optimizer step (jiapingW: 32 ranks x 2 x 2 = 128).
  batch_size: 2
  accumulation_steps: 11
  fsdp_sharding: SHARD_GRAD_OP
  ddp_bucket_cap_mb: 128
  learning_rate: 0.0006
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  # Skip the update on a gradient-norm outlier: the 8 x 1536 run took one at step 8,580 (145 x the recent
  # median) that cost ~900 steps of recovery; a 10 x rule would have skipped only that step and one other.
  spike_guard_ratio: 10
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 0.0
  # A checkpoint every 1,000 steps, each exported and uploaded; the trainer only saves on interval hits, so the
  # last one of the 64,584-step run is step 64,000 (the cosine lr is ~0 by then).
  save_interval: 1000
  # Epoch ends (10,764 steps each) are not on the 1,000-step grid: checkpoint them too (ep1 … ep5; ep6 is the last step).
  save_steps: [10764, 21528, 32292, 43056, 53820]
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 42

tracking:
  report_to: none

runtime:
  producer_lease: 8
  producer_concurrency: 8
  # Both watermarks must cover the 132-sample optimizer quantum.
  in_flight_high_watermark: 528
  in_flight_low_watermark: 396
  resident_high_watermark_bytes: 214748364800
  resident_low_watermark_bytes: 128849018880
  feature_store_max_resident_bytes: 274877906944

run_id: qwen3-8b-dense-24576-dspark-2server-dp6-h200
output_dir: outputs/qwen3-8b-dense-24576-dspark-2server-dp6-h200

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 6
  disaggregated:
    control_dir: outputs/qwen3-8b-dense-24576-dspark-2server-dp6-h200/control
    consumer_state_dir: outputs/qwen3-8b-dense-24576-dspark-2server-dp6-h200/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    managed_local:
      trainer_cuda_visible_devices: ["2", "3", "4", "5", "6", "7"]
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 107374182400
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 300000
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["0"]
          tp_size: 1
        - port: 30001
          cuda_visible_devices: ["1"]
          tp_size: 1
